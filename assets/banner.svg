<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="AI Builder on the way">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#11263a"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8f6ff"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
      <animate attributeName="x1" values="-1;0;-1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.6;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-30%" y="-60%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="16" fill="url(#grid)"/>
  <ellipse cx="250" cy="70" rx="380" ry="170" fill="url(#halo)"/>
  <ellipse cx="980" cy="215" rx="320" ry="150" fill="url(#halo)" opacity="0.65"/>
  <rect width="1200" height="260" rx="16" fill="url(#sweep)"/>

  <g font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace">
    <text x="64" y="86" font-size="15" fill="#5eead4" letter-spacing="5" opacity="0.92">$ whoami</text>

    <text x="64" y="150" font-size="52" font-weight="700" filter="url(#glow)">
      <tspan fill="url(#ink)">AI Builder on the way</tspan><tspan fill="#22d3ee" dx="10">&#9612;<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan>
      <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
    </text>

    <text x="66" y="192" font-size="16" fill="#9fb6c8" letter-spacing="1.4">
      backend by trade &#183; agent infra by obsession &#183; read the source, measure it, then patch it
    </text>

    <g font-size="13" letter-spacing="1.2">
      <g transform="translate(64,214)">
        <rect width="132" height="28" rx="14" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/>
        <text x="18" y="19" fill="#67e8f9">AGENT&#160;INFRA</text>
      </g>
      <g transform="translate(208,214)">
        <rect width="150" height="28" rx="14" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.45"/>
        <text x="18" y="19" fill="#c4b5fd">RAG&#160;&#183;&#160;RETRIEVAL</text>
      </g>
      <g transform="translate(370,214)">
        <rect width="168" height="28" rx="14" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.45"/>
        <text x="18" y="19" fill="#f9a8d4">DEVELOPER&#160;TOOLING</text>
      </g>
      <g transform="translate(550,214)">
        <rect width="128" height="28" rx="14" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/>
        <text x="18" y="19" fill="#6ee7b7">OPEN&#160;SOURCE</text>
      </g>
    </g>
  </g>

  <g stroke="#22d3ee" stroke-opacity="0.55" stroke-linecap="round">
    <line x1="1136" y1="52" x2="1136" y2="208" stroke-width="2" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" values="0;-64" dur="2.6s" repeatCount="indefinite"/>
    </line>
    <line x1="1104" y1="78" x2="1104" y2="182" stroke-width="2" stroke-dasharray="4 12" stroke-opacity="0.35">
      <animate attributeName="stroke-dashoffset" values="0;64" dur="3.4s" repeatCount="indefinite"/>
    </line>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="16" fill="none" stroke="#22d3ee" stroke-opacity="0.28"/>
</svg>
